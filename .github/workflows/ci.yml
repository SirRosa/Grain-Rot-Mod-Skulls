name: GrainRotSkulls - test and package
on:
  push:
    branches: [main]
    paths: ['ue4ss/**', 'tests/**', '.github/workflows/ci.yml', 'README.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
      - name: Lua parse checks
        run: |
          luac5.4 -p ue4ss/Mods/GrainRotSkulls/Scripts/main.lua
          luac5.4 -p tests/test_skulls.lua
      - name: Test probability logic
        run: lua5.4 tests/test_skulls.lua
      - name: Prepare mod ZIP
        run: |
          mkdir -p out
          cd ue4ss
          zip -r ../out/GrainRotSkulls-v0.1.0-alpha.zip Mods/GrainRotSkulls
          cd ..
          unzip -t out/GrainRotSkulls-v0.1.0-alpha.zip
          sha256sum out/GrainRotSkulls-v0.1.0-alpha.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GrainRotSkulls-v0.1.0-alpha
          path: out/GrainRotSkulls-v0.1.0-alpha.zip
          if-no-files-found: error
