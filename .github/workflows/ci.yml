name: GrainRotSkulls v0.2 - tests and installation ZIP
on:
  push:
    branches: [main]
    paths: ['ue4ss/**', 'tests/**', '.github/workflows/ci.yml', 'README.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
      - name: Validate scripts
        run: |
          find ue4ss tests -name '*.lua' -print -exec luac5.4 -p {} \;
      - name: Run policy tests
        run: lua5.4 tests/test_skulls.lua
      - name: Simulate UE4SS runtime with zero players
        run: lua5.4 tests/test_runtime.lua
      - name: Build installation package
        run: |
          mkdir -p out
          cd ue4ss
          zip -r ../out/GrainRotSkulls-v0.2.0-alpha.zip Mods/GrainRotSkulls
          cd ..
          unzip -t out/GrainRotSkulls-v0.2.0-alpha.zip
          sha256sum out/GrainRotSkulls-v0.2.0-alpha.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GrainRotSkulls-v0.2.0-alpha
          path: out/GrainRotSkulls-v0.2.0-alpha.zip
          if-no-files-found: error

      - name: Publish single-install ZIP to GitHub Releases
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file=out/GrainRotSkulls-v0.2.0-alpha.zip
          tag=v0.2.0-alpha
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --clobber
          else
            gh release create "$tag" "$file" --title 'GrainRotSkulls v0.2.0-alpha' --notes 'Experimental host-side forced three red skull elevator modifiers. Lua syntax and mocked engine tests pass; real multiplayer game behavior requires validation.'
          fi
