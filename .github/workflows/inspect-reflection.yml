name: Inspect Grain Rot elevator reflection
on:
  push:
    paths:
      - '.github/workflows/inspect-reflection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game reflection database
        uses: actions/checkout@v4
        with:
          repository: SirRosa/Grain-Rot-Mod-Data-Base
          ref: main
          persist-credentials: false
      - name: Scan authoritative reflection dump
        shell: bash
        run: |
          python - <<'PY'
          import gzip, json, re
          from pathlib import Path
          db=json.loads(gzip.decompress(Path('data/current-schema.json.gz').read_bytes()))
          match=re.compile(r'skull|grain.?rot|corrupt|modifier|elevator|slot|chance|random|roulette|curse|dungeon.?affix',re.I)
          print('SCHEMA CATEGORIES:',list(db.keys()))
          for category in ['structs','enums']:
            entries=db[category]
            hits=[(k,v) for k,v in entries.items() if match.search(k) and (k.startswith('Helden') or k.startswith('EHelden') or k.startswith('BP_'))]
            print('===',category,'MATCHING TYPES',len(hits),'===')
            for k,v in hits[:125]:
              s=json.dumps(v,ensure_ascii=False)
              print(k,':',s[:1300])
          print('=== DIRECT ELEVATOR/ROT FIELDS IN HELDEN TYPES ===')
          matches=[]
          for k,v in db.get('structs',{}).items():
            if not (k.startswith('Helden') or k.startswith('BP_')): continue
            vs=json.dumps(v,ensure_ascii=False)
            if match.search(vs):
              matches.append((k,vs))
          print('type count',len(matches))
          for k,vs in matches[:180]:
            keys=re.findall(r'"[^"]*(?:skull|rot|modifier|chance|random|elevator|slot|affix)[^"]*"',vs,re.I)
            print(k, ':', ' '.join(dict.fromkeys(keys))[:900])
          raw=b''.join(p.read_bytes() for p in sorted(Path('data').glob('UE4SS-ObjectDump.txt.gz.part*')))
          dump=gzip.decompress(raw).decode('utf-8','replace')
          lines=dump.splitlines()
          interesting=re.compile(r'(Skull|GrainRot|Grain_Rot|Elevator.*(Event|Modifier|Roll|Slot)|Dungeon.*Modifier|Modifier.*Dungeon|Chance.*Skull)',re.I)
          found=[(i,line) for i,line in enumerate(lines) if interesting.search(line) and ('Helden' in line or 'BP_' in line)]
          print('=== OBJECTDUMP MATCHES:',len(found),'===')
          for i,line in found[:400]:
            print(i+1,line[:300])
          PY
