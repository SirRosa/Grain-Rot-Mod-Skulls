name: Inspect Grain Rot elevator reflection
on:
  push:
    paths:
      - '.github/workflows/inspect-reflection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SirRosa/Grain-Rot-Mod-Data-Base
          ref: main
          persist-credentials: false
      - name: Inspect modifier data structures and functions
        shell: bash
        run: |
          python - <<'PY'
          import gzip,json,re
          from pathlib import Path
          db=json.loads(gzip.decompress(Path('data/current-schema.json.gz').read_bytes()))
          types=['HeldenDungeonGenerationInfo','HeldenDungeonModiferContainer','HeldenDungeonModiferData','HeldenDungeonModiferDataTable','HeldenDungeonPresetData','HeldenDungeonPreset','HeldenDungeonLevelData','HeldenDungeonMetaData','HeldenDataSingleton','HeldenActiveDungeonRun','HeldenDungeonFunctions','HeldenDungeonAddon','HeldenDungeonRoomStyleSelection','HeldenCharacterData','HeldenStats','HeldenReplicatedStats']
          for k in types:
            val=db['structs'].get(k)
            print('TYPE',k,json.dumps(val,ensure_ascii=False))
          raw=b''.join(p.read_bytes() for p in sorted(Path('data').glob('UE4SS-ObjectDump.txt.gz.part*')))
          lines=gzip.decompress(raw).decode('utf-8','replace').splitlines()
          filt=re.compile(r'Function /Script/Helden\.(HeldenDungeonFunctions|HeldenDungeonModiferContainer|HeldenDungeonPreset|HeldenDungeonAddon|HeldenDataSingleton|HeldenDungeonLevelData):',re.I)
          print('=== METHODS ===')
          inds=[i for i,line in enumerate(lines) if filt.search(line)]
          print('count',len(inds))
          for i in inds:
            print(lines[i][:250])
            for j in range(i+1,min(i+8,len(lines))):
              if 'Property ' not in lines[j]: break
              print('  '+lines[j][:200])
          print('=== BLUEPRINT MODIFIER ASSETS ===')
          match=re.compile(r'/Game/.+(?:Skull|Modifer|Modifier)',re.I)
          c=0
          for line in lines:
            if match.search(line) and ('BlueprintGeneratedClass' in line or 'DataTable ' in line or 'DataAsset ' in line or 'Package ' in line):
              print(line[:400]);c+=1
              if c>100:break
          PY
