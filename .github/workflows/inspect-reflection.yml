name: Inspect Grain Rot elevator reflection
on:
  push:
    paths:
      - '.github/workflows/inspect-reflection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game reflection database
        uses: actions/checkout@v4
        with:
          repository: SirRosa/Grain-Rot-Mod-Data-Base
          ref: main
          persist-credentials: false
      - name: Inspect elevator roll, modifiers and player grain rot
        shell: bash
        run: |
          python - <<'PY'
          import gzip, json, re
          from pathlib import Path
          db=json.loads(gzip.decompress(Path('data/current-schema.json.gz').read_bytes()))
          structs=db['structs']
          print('=== NAME INDEX ===')
          for name in sorted(structs):
            if name.startswith('Helden') and re.search('Dungeon|Modifer|Modifier|GrainRot|StatsComponent|PlayerState|PlayerController|Elevator|CharcterData|CharacterData',name,re.I):
              print(name)
          print('=== TARGET CLASS DEFINITIONS ===')
          for name in ['HeldenElevatorMachine','HeldenDungeonActor','HeldenDungeonPresetSettings','HeldenDungeonModiferDataTable','HeldenDungeonRunStats','HeldenStatsComponent','HeldenCharacter','HeldenCharacterStats','HeldenCharacterSaveData','HeldenPlayerState','HeldenGameState','HeldenGameMode','HeldenPlayerController','HeldenDungeonLevelSettings']:
            if name in structs:
              print(name, json.dumps(structs[name],ensure_ascii=False))
          print('=== ALL MODIFIER ENUMS ===')
          for name, val in db['enums'].items():
            if re.search('Dungeon|Modifer|Modifier|Rot',name,re.I) and name.startswith('EHelden'):
              print(name, json.dumps(val,ensure_ascii=False))
          raw=b''.join(p.read_bytes() for p in sorted(Path('data').glob('UE4SS-ObjectDump.txt.gz.part*')))
          lines=gzip.decompress(raw).decode('utf-8','replace').splitlines()
          print('=== FUNCTION METHOD SIGNATURES ===')
          filt=re.compile(r'Function /Script/Helden\.(HeldenElevatorMachine|HeldenDungeonActor|HeldenDungeonModifer|HeldenDungeonPreset|HeldenStatsComponent|HeldenGameState|HeldenGameMode|HeldenPlayerController|HeldenCharacterStats|HeldenCharacter):',re.I)
          inds=[i for i,line in enumerate(lines) if filt.search(line)]
          print('function count',len(inds))
          for i in inds:
            print(i+1,lines[i][:240])
            # Following parameter property entries are the authoritative UFunction signature.
            j=i+1
            while j < len(lines) and j-i <= 9 and re.search(r'(Property|Delegate) ',lines[j]) and ':ReturnValue' not in lines[j]:
              print('  '+lines[j][:230])
              j+=1
          PY
